<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rigged Tree Generator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="panel">
            <h1>Tree Gen</h1>
            <div class="controls">
                <div class="control-group">
                    <label>LOD Level:</label>
                    <div class="segmented-control">
                        <button id="lod-low" onclick="window.setLOD('low')">Low</button>
                        <button id="lod-med" onclick="window.setLOD('med')" class="active">Med</button>
                        <button id="lod-high" onclick="window.setLOD('high')">High</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>Wind Strength: <span id="wind-val">0.5</span></label>
                    <input type="range" id="wind-slider" min="0" max="2" step="0.1" value="0.5">
                </div>

                <div class="control-group">
                    <button id="btn-falling-leaves" class="toggle-btn active">Falling Leaves: ON</button>
                </div>

                <div class="control-group">
                    <button id="btn-export" class="action-btn">Download .GLB (Current LOD)</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="loading">Generating Tree...</div>

    <script type="module" src="./main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
